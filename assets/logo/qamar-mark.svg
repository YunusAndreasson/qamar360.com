<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent mark: white crescent + 360 ring, for use on dark surfaces (splash, adaptive foreground). -->
  <defs>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="575" cy="480" r="250" fill="white"/>
      <circle cx="687" cy="424" r="250" fill="black"/>
    </mask>
  </defs>
  <circle cx="512" cy="512" r="384" fill="none" stroke="#FFFFFF" stroke-width="20"/>
  <g mask="url(#crescent)">
    <rect width="1024" height="1024" fill="#FFFFFF"/>
  </g>
</svg>
