<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Single-color silhouette (white on transparent). Alpha defines the shape; the
       Android themed-icon system tints it. Same geometry as the mark/icon. -->
  <defs>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="575" cy="480" r="250" fill="white"/>
      <circle cx="687" cy="424" r="250" fill="black"/>
    </mask>
  </defs>
  <circle cx="512" cy="512" r="384" fill="none" stroke="#FFFFFF" stroke-width="20"/>
  <g mask="url(#crescent)">
    <rect width="1024" height="1024" fill="#FFFFFF"/>
  </g>
</svg>
