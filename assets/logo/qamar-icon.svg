<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2A3C90"/>
      <stop offset="0.55" stop-color="#172456"/>
      <stop offset="1" stop-color="#0A1130"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.46" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#8EA0E8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8EA0E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#FDFBF3"/>
      <stop offset="1" stop-color="#D9E0F2"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9FB0EE"/>
      <stop offset="1" stop-color="#5566B0"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="536" cy="512" r="250" fill="white"/>
      <circle cx="646" cy="452" r="250" fill="black"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="470" cy="500" r="470" fill="url(#glow)"/>

  <!-- 360 ring -->
  <circle cx="512" cy="512" r="384" fill="none" stroke="url(#ring)" stroke-width="13" stroke-opacity="0.6"/>

  <!-- crescent moon -->
  <g mask="url(#crescent)">
    <rect width="1024" height="1024" fill="url(#moon)"/>
  </g>
</svg>
